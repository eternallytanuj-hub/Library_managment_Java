# ==============================================================================
# Online Library Management System - Application Configuration
# ==============================================================================

# ==============================================================================
# 1. Active Database Configuration: Embedded H2 (MySQL Mode) [DEFAULT]
# Provides turnkey zero-setup persistence; data files persist under ./data/
# ==============================================================================
jdbc.driver=org.h2.Driver
jdbc.url=jdbc:h2:./data/librarydb;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE
jdbc.user=sa
jdbc.password=

# ==============================================================================
# 2. Alternative Database Configuration: Standalone MySQL 8.0+
# To switch to MySQL:
#   1. Comment out the 4 H2 properties above.
#   2. Uncomment the 4 MySQL properties below.
#   3. Ensure MySQL service is running and 'librarydb' exists or can be created.
# ==============================================================================
# jdbc.driver=com.mysql.cj.jdbc.Driver
# jdbc.url=jdbc:mysql://localhost:3306/librarydb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
# jdbc.user=root
# jdbc.password=rootpassword

# ==============================================================================
# 3. HikariCP Connection Pool Settings
# Enterprise connection pooling managing reusable pooled physical connections.
# ==============================================================================
hikari.poolName=LibraryHikariPool
hikari.minimumIdle=5
hikari.maximumPoolSize=20
hikari.connectionTimeout=30000
hikari.idleTimeout=600000
hikari.maxLifetime=1800000

# ==============================================================================
# 4. Database Bootstrap & Seeding Flags
# Automatically runs schema.sql and data.sql if core tables are absent.
# ==============================================================================
app.db.autoInit=true
app.db.schemaPath=db/schema.sql
app.db.dataPath=db/data.sql

# ==============================================================================
# 5. Core Business & Concurrency Rules
# ==============================================================================
# Standard loan duration in days
app.loan.durationDays=14

# Fine accrued per overdue day in USD
app.loan.fineRatePerDay=1.00

# Maximum simultaneous active loans permitted per member
app.loan.maxActiveLoans=5

# Background DueDateMonitorDaemon polling interval in seconds
app.daemon.intervalSeconds=60

# Asynchronous notification dispatcher worker thread pool size
app.async.notificationThreads=2
