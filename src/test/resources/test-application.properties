# ==============================================================================
# Online Library Management System - Test Application Configuration (Alias)
# ==============================================================================
jdbc.driver=org.h2.Driver
jdbc.url=jdbc:h2:mem:testlibrarydb;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE
jdbc.user=sa
jdbc.password=

hikari.poolName=TestLibraryHikariPool
hikari.minimumIdle=2
hikari.maximumPoolSize=10
hikari.connectionTimeout=10000
hikari.idleTimeout=60000
hikari.maxLifetime=180000

app.db.autoInit=true
app.db.schemaPath=db/schema.sql
app.db.dataPath=db/data.sql

app.loan.durationDays=14
app.loan.fineRatePerDay=1.00
app.loan.maxActiveLoans=5
app.daemon.intervalSeconds=5
app.async.notificationThreads=2
